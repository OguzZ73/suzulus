<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f6e"/>
      <stop offset="0.42" stop-color="#8a5c9c"/>
      <stop offset="0.72" stop-color="#f39a7a"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.38" stop-color="#ffe2a0"/>
      <stop offset="0.4" stop-color="#ffd38a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb070" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9799f"/>
      <stop offset="1" stop-color="#d99a9a"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c4f8c"/>
      <stop offset="1" stop-color="#8a6396"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a5c"/>
      <stop offset="1" stop-color="#1b1b44"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e6d3b4"/>
    </linearGradient>
    <linearGradient id="sailFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a892"/>
      <stop offset="1" stop-color="#d2c0a6"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="nearSail"><path d="M398 176 L96 262 Q112 232 138 190 Z"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g fill="#fff" opacity="0.8">
      <circle cx="78" cy="70" r="2.6"/><circle cx="150" cy="118" r="1.8"/><circle cx="236" cy="56" r="2.2"/>
      <circle cx="330" cy="92" r="1.6"/><circle cx="420" cy="60" r="2.4"/><circle cx="452" cy="150" r="1.6"/><circle cx="52" cy="170" r="1.5"/>
    </g>
    <circle cx="352" cy="330" r="150" fill="url(#sun)"/>
    <path d="M-10 372 L60 316 L104 348 L176 270 L232 330 L286 296 L352 352 L410 306 L470 344 L530 318 L530 520 L-10 520 Z" fill="url(#far)"/>
    <path d="M-10 420 L70 372 L130 404 L214 352 L290 410 L372 368 L440 404 L530 372 L530 520 L-10 520 Z" fill="url(#mid)"/>
    <path d="M-10 470 Q90 420 190 452 T380 446 T530 430 L530 520 L-10 520 Z" fill="url(#near)"/>
    <g fill="#1b1b44">
      <path d="M70 452 l12 -34 l12 34 z"/><path d="M96 458 l10 -26 l10 26 z"/><path d="M410 446 l13 -38 l13 38 z"/><path d="M440 444 l10 -28 l10 28 z"/>
    </g>
    <!-- wake of air behind the wing tip -->
    <path d="M20 292 Q58 284 90 266" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    <!-- glider -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M398 176 L170 96 Q160 140 138 190 Z" fill="url(#sailFar)"/>
      <path d="M398 176 L170 96" stroke="#3b4252" stroke-width="7" fill="none"/>
      <path d="M398 176 L96 262 Q112 232 138 190 Z" fill="url(#sail)"/>
      <g clip-path="url(#nearSail)" fill="none">
        <path d="M420 158 L80 255" stroke="#34507e" stroke-width="20"/>
        <path d="M420 140 L80 237" stroke="#d9574a" stroke-width="17"/>
        <path d="M420 124 L80 221" stroke="#e9b34e" stroke-width="13"/>
        <path d="M300 204 L230 176 M230 224 L176 186 M166 242 L150 196" stroke="#6b5646" stroke-width="2" opacity="0.4"/>
      </g>
      <path d="M398 176 L138 190" stroke="#4a5062" stroke-width="4" fill="none" opacity="0.8"/>
      <path d="M398 176 L96 262" stroke="#232836" stroke-width="10" fill="none"/>
      <path d="M392 174 L104 256" stroke="#fff" stroke-width="2" fill="none" opacity="0.3"/>
      <circle cx="398" cy="176" r="9" fill="#232836"/>
      <!-- control frame and wires -->
      <path d="M306 344 L398 176 M306 344 L138 190" stroke="#4a5062" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M262 204 L250 300" stroke="#3b2c22" stroke-width="5" fill="none"/>
      <path d="M268 200 L322 328" stroke="#8f96a3" stroke-width="5" fill="none"/>
      <!-- pilot -->
      <path d="M232 312 Q190 310 150 306" stroke="#2a3247" stroke-width="18" fill="none"/>
      <ellipse cx="140" cy="306" rx="16" ry="10" fill="#5b3a24"/>
      <ellipse cx="250" cy="314" rx="44" ry="20" fill="#3f6a9c"/>
      <!-- scarf -->
      <path d="M284 298 Q244 270 204 284 Q172 294 140 272 L134 288 Q172 312 208 300 Q244 290 280 312 Z" fill="#ea5a4c"/>
      <path d="M204 284 Q172 294 140 272 L134 288 Q172 312 208 300 Z" fill="#a92f2b" opacity="0.55"/>
      <!-- head -->
      <circle cx="298" cy="304" r="20" fill="#e4b892"/>
      <path d="M277 306 A21 21 0 0 1 319 300 Z" fill="#e8e2d4"/>
      <path d="M279 302 L315 298" stroke="#5a4030" stroke-width="5"/>
      <circle cx="312" cy="299" r="8.5" fill="#c99a4a"/><circle cx="313" cy="299" r="5.5" fill="#a7dcec"/>
      <!-- near down tube, base bar and arm in front -->
      <path d="M262 204 L306 344 L322 328" stroke="#c4cad6" stroke-width="6" fill="none"/>
      <path d="M272 318 Q294 324 306 342" stroke="#35557f" stroke-width="13" fill="none"/>
      <circle cx="306" cy="343" r="8.5" fill="#e4b892"/>
    </g>
  </g>
</svg>
